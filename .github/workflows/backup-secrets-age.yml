name: Encrypted secrets backup

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      AGE_RECIPIENT: age1y3nwnuklr3uvltzjejthktvn5pdqdreylq04t8ghwkala32cn96sukzaw8
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Encrypt secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open('icaiu-data.secrets.json', 'w', encoding='utf-8') as f:
              json.dump(json.loads(os.environ['ALL_SECRETS']), f, ensure_ascii=False, indent=2)
          PY
          age -r "$AGE_RECIPIENT" -o icaiu-data.secrets.json.age icaiu-data.secrets.json
          shred -u icaiu-data.secrets.json
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: icaiu-data-secrets-age
          path: icaiu-data.secrets.json.age
          retention-days: 1
